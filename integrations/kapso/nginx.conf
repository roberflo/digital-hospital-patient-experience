events {}
http {
    access_log off;
    server_tokens off;
    server {
        listen 8080;
        client_max_body_size 2m;
        location = /webhooks/kapso {
            limit_except POST { deny all; }
            resolver 127.0.0.11 valid=10s;
            set $receiver http://recepcion-api:8080;
            proxy_pass $receiver;
            proxy_connect_timeout 3s;
            proxy_read_timeout 9s;
        }
        location / { return 404; }
    }
}
