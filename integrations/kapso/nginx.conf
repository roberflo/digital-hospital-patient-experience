events {}
http {
    access_log off;
    server_tokens off;
    server {
        listen 8080;
        client_max_body_size 2m;
        location = /webhooks/kapso {
            limit_except POST { deny all; }
            mirror /_inbox_events;
            mirror_request_body on;
            resolver 127.0.0.11 valid=10s;
            set $receiver http://recepcion-api:8080;
            proxy_pass $receiver;
            proxy_connect_timeout 3s;
            proxy_read_timeout 9s;
        }
        # Preserve existing CRM ingestion; the provider-backed inbox receives the same
        # signed bytes without persisting a second message history in Next.js.
        location = /_inbox_events {
            internal;
            resolver 127.0.0.11 valid=10s;
            set $inbox http://web:3000/api/kapso/webhook;
            proxy_pass $inbox;
            proxy_connect_timeout 3s;
            proxy_read_timeout 9s;
        }
        location / { return 404; }
    }
}
