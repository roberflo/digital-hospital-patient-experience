# Optional API sidecar; keeps hospital-api-1 and every existing service unchanged.
# Supply a mode-0600 file with the active API's runtime environment only.
# Do not use Hospital's root .env: it also holds migration/key administration secrets.
# No startup, migration, seed or outbound provider enabling occurs by building this image.
name: hospital-recepcion
services:
  hospital-recepcion-api:
    image: hospital/api:recepcion-patient-agenda
    env_file:
      - ${HOSPITAL_RECEPTION_RUNTIME_ENV_FILE:?Set a private file containing API runtime environment}
    networks:
      hospital:
        aliases:
          - hospital-recepcion-api
      hospital-keys: {}
    restart: unless-stopped
    # No host port: Recepcion API can reach http://hospital-recepcion-api:8080
    # after it is explicitly joined to the hospital network.
networks:
  hospital:
    external: true
    name: hospital
  hospital-keys:
    external: true
    name: hospital_hospital-keys
