name: Verify CRM
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Sign-in is Hospital's Keycloak, which this repository cannot start on its own. What runs
      # here needs no identity provider; tests/api_smoke.py and the browser suite run locally
      # against the Hospital stack (README, «Verificación») until CI can bring that realm up.
      - run: python3 scripts/init-dev.py
      - run: docker compose build recepcion-api web
      - run: docker compose up -d db
      - run: scripts/test-backend.sh
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run test:server --prefix frontend
      - run: npm run format:check --prefix frontend
      - if: always()
        run: docker compose down
